[project]
name = "stateful-agent-platform"
version = "0.1.0"
description = "Stateful AI agent platform: LangGraph runtime, multiplexed WebSocket streaming, MCP admin tools, SpiceDB authorization"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.0",
  "langgraph-checkpoint-sqlite>=3.0",
  "langchain-core>=1.0",
  "mcp>=2.0",
  "authzed>=1.20",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "websockets>=13",
  "pyjwt>=2.8",
  "aiosqlite>=0.20",
  "httpx>=0.27",
]

[project.optional-dependencies]
anthropic = ["langchain>=1.0", "langchain-anthropic>=1.0"]
openai = ["langchain>=1.0", "langchain-openai>=1.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.authz" = ["schema.zed"]
